# Avisa (con un PR) cuando una acción de GitHub o una herramienta de pruebas tiene versión nueva o falla de seguridad.
# Three.js va copiado en vendor/: ese se actualiza a mano (ver docs/SEGURIDAD.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      herramientas:
        patterns: ["*"]
