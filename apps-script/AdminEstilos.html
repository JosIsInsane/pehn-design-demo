<style>
  /* estilo panel: menú oscuro café, tarjetas con tinte, tablas limpias con estado en píldora */
  :root{--bg:#F6F1EA;--bg2:#F1EADF;--sf:#fff;--sf2:#FBF8F4;--ink:#1E1611;--ink2:#5C4C41;--ink3:#8B7B6F;--line:#EDE5DA;--line2:#DDD0C0;
    --brand:#F08A1C;--brand6:#DB7409;--brandInk:#9A4906;--brandSoft:#FDEFD9;--gold:#B8862F;
    --ok:#1F6A40;--okSoft:#E2F3EA;--bad:#8A2A1A;--badSoft:#F8E1DC;--warn:#6E5200;--warnSoft:#FBF1D2;--prog:#2FA67A;
    --dark:#211812;--dark2:#2C211A;--darkInk:#CDBFB1;--darkLine:rgba(255,255,255,.08);
    --r:16px;--r2:12px;--sh:0 1px 2px rgba(30,22,17,.04),0 6px 20px -14px rgba(30,22,17,.22);--side:250px}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  a{color:inherit}
  :focus-visible{outline:2.5px solid var(--brand6);outline-offset:2px;border-radius:8px}
  h1,h2,h3{font-family:Inter,system-ui,sans-serif;font-weight:600;letter-spacing:-.02em;margin:0}
  svg{display:block}
  .app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh;background:linear-gradient(90deg,var(--dark) var(--side),transparent 0)}
  /* menú lateral oscuro */
  .side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:18px 14px;background:var(--dark);color:var(--darkInk)}
  .logo{display:flex;align-items:center;gap:11px;padding:4px 8px 20px;margin-bottom:6px;border-bottom:1px solid var(--darkLine)}
  .logo b{width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--dark);display:grid;place-items:center;font-family:Fraunces,serif;font-size:18px;flex:none;box-shadow:0 0 0 3px rgba(240,138,28,.18)}
  .logo span{font-family:Fraunces,serif;font-size:17px;font-weight:600;color:#fff;line-height:1.2}
  .logo small{display:block;font-family:Inter;font-size:11.5px;color:var(--darkInk);font-weight:500;opacity:.8}
  .slbl{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--darkInk);opacity:.55;padding:14px 12px 6px}
  .nav{display:grid;gap:2px}
  .nav button,.side .sl{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;font-weight:500;font-size:13.5px;color:var(--darkInk);text-align:left;text-decoration:none;transition:background-color .2s,color .2s;width:100%}
  .nav button:hover,.side .sl:hover{background:var(--darkLine);color:#fff}
  .nav button[aria-current="page"]{background:var(--dark2);color:#fff;box-shadow:inset 3px 0 0 var(--brand),inset 0 0 0 1px var(--darkLine)}
  .nav button[aria-current="page"] svg{color:var(--brand)}
  .nav svg,.side .sl svg{width:18px;height:18px;flex:none}
  .nav .ct{margin-left:auto;min-width:21px;height:21px;padding:0 7px;border-radius:999px;background:var(--brand);color:var(--dark);font-size:11px;font-weight:700;display:grid;place-items:center}
  .nav .ct[hidden]{display:none}
  .nav .lbl-s{display:none}
  .side .foot{margin-top:auto;padding-top:12px}
  .me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--dark2);border:1px solid var(--darkLine)}
  .me>b{width:34px;height:34px;border-radius:50%;background:#E9C77B;color:var(--dark);display:grid;place-items:center;font-weight:700;flex:none}
  .me div{min-width:0}
  .me strong{display:block;color:#fff;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .me small{display:block;font-size:11.5px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* zona principal */
  .main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:12px 28px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .crumb{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;white-space:nowrap}
  .crumb i{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--ink2)}
  .crumb i svg{width:17px;height:17px}
  .gs{position:relative;margin-left:auto;width:min(380px,40vw)}
  .gs input{width:100%;height:38px;padding:0 40px;border-radius:10px;border:1px solid var(--line2);background:var(--sf2)}
  .gs input:focus{outline:none;border-color:var(--ink);background:var(--sf);box-shadow:0 0 0 4px rgba(240,138,28,.14)}
  .gs>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink3)}
  .gs kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font:600 11px Inter;color:var(--ink3);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--sf)}
  .gs-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--sf);border-radius:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);border:1px solid var(--line);max-height:60vh;overflow:auto;padding:6px}
  .gs-res[hidden]{display:none}
  .gs-res h4{margin:8px 10px 4px;font:600 11px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
  .gs-res button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:10px}
  .gs-res button:hover,.gs-res button.on{background:var(--bg)}
  .gs-res small{color:var(--ink3);margin-left:auto;white-space:nowrap}
  .ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--ink2);background:var(--sf);flex:none;transition:border-color .2s,color .2s}
  .ib:hover{border-color:var(--ink);color:var(--ink)}
  .ib svg{width:17px;height:17px}
  .content{padding:24px 28px 60px;max-width:1500px;width:100%}
  .view[hidden]{display:none}
  /* encabezado de cada vista */
  .phead[hidden]{display:none}
  .phead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .phead h1{font-size:24px}
  .phead p{margin:2px 0 0;color:var(--ink3);font-size:13.5px}
  .phead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .datec{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--sf);font-weight:500;font-size:13px;white-space:nowrap}
  .datec svg{width:16px;height:16px;color:var(--ink3)}
  /* bienvenida */
  .hero{position:relative;overflow:hidden;display:flex;gap:20px;align-items:center;padding:24px 26px;margin-bottom:18px;border-radius:var(--r);background:linear-gradient(120deg,#FFF9F0 0%,#FCEBD3 100%);border:1px solid #F1DDC0}
  .hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(240,138,28,.22),transparent 70%)}
  .hero h2{font-size:23px}
  .hero p{margin:4px 0 14px;color:var(--ink2)}
  .hero .actions{position:relative;z-index:1}
  /* piezas comunes */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line2);background:var(--sf);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap;transition:border-color .2s,background-color .2s,transform .2s}
  .btn:hover{border-color:var(--ink)}
  .btn:active{transform:scale(.97)}
  .btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.dark:hover{background:#3A2B21}
  .btn.brand{background:var(--brand);border-color:var(--brand);color:var(--ink)}
  .btn.gold{background:linear-gradient(180deg,#C89640,#A87526);border-color:#A87526;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .btn.wa{background:#25D366;border-color:#25D366;color:#fff}
  .btn.sm{min-height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn svg{width:15px;height:15px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{position:relative;display:block;text-align:left;background:var(--sf);border-radius:var(--r);padding:16px 18px;border:1px solid var(--line);transition:border-color .2s,transform .2s}
  button.kpi:hover{border-color:var(--line2);transform:translateY(-1px)}
  .kpi small{display:block;color:var(--kc,var(--ink2));font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding-right:40px}
  .kpi b{display:flex;align-items:center;gap:8px;font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.15}
  .kpi.bad b{color:var(--bad)}
  .kpi span{display:block;font-size:12.5px;color:var(--ink3);margin-top:4px}
  .kpi .ki{position:absolute;top:13px;right:13px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.7);color:var(--kc,var(--ink2));border:1px solid rgba(30,22,17,.06)}
  .kpi .ki svg{width:16px;height:16px}
  .pill{display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:0}
  .pill.up{background:#DDF1E5;color:#17663D}.pill.down{background:#F8E1DC;color:#9A2E1C}
  .t-brand{background:#FDF2E2;border-color:#F5E0C2;--kc:#9A4906}
  .t-mint{background:#E9F5EE;border-color:#D3EADD;--kc:#1F6A40}
  .t-lav{background:#F0ECFA;border-color:#E0D8F4;--kc:#5838B0}
  .t-sky{background:#E8F0FA;border-color:#D4E2F4;--kc:#24529E}
  .t-rose{background:#FAEAE6;border-color:#F1D3CC;--kc:#8A2A1A}
  .card{background:var(--sf);border-radius:var(--r);border:1px solid var(--line);padding:18px 20px}
  .card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .ch{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .ch h3{margin:0}
  .lnk{margin-left:auto;font-weight:600;font-size:13px;color:var(--brandInk)}
  .lnk:hover{text-decoration:underline}
  .grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
  .grid2>*,.kpis>*{min-width:0}
  .nw{white-space:nowrap}
  /* panel con tabla */
  .panel{background:var(--sf);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
  .pnh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px}
  .pnh h3{display:flex;align-items:center;gap:10px;font-size:15.5px;margin-right:auto}
  .pnh h3 i{width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--ink2)}
  .pnh h3 i svg{width:16px;height:16px}
  .cnt{font-size:12px;font-weight:600;color:var(--ink3);background:var(--bg);padding:2px 8px;border-radius:999px}
  .panel>.chips{padding:0 16px 12px}
  .panel .tw{border-radius:0;box-shadow:none;border:0;border-top:1px solid var(--line)}
  .panel .pager{margin:0;padding:12px 16px;border-top:1px solid var(--line)}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .search{flex:1 1 200px;max-width:280px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--sf2)}
  .search:focus{outline:none;border-color:var(--ink);background-color:var(--sf)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink2);transition:border-color .2s}
  .chips button:hover{border-color:var(--line2);color:var(--ink)}
  .chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chips i{font-style:normal;opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--bg2);white-space:nowrap}
  .tag.info{background:#E4F0FA;color:#1F5F99}.tag.ok{background:var(--okSoft);color:var(--ok)}.tag.bad{background:var(--badSoft);color:var(--bad)}.tag.warn{background:var(--warnSoft);color:var(--warn)}
  .st-Nuevo{--c:#E07A0B;background-color:#FDEFD9;color:#8A4A06}
  .st-Diseño{--c:#7A5AE0;background-color:#EEE9FB;color:#4B2FA8}
  .st-Aprobado{--c:#3B6FE0;background-color:#E5EEFB;color:#1F4AA8}
  .st-En{--c:#C99A1E;background-color:#FBF1D2;color:#6E5200}
  .st-Listo{--c:#23A06A;background-color:#E2F3EA;color:#16653F}
  .st-Enviado{--c:#1A9A8A;background-color:#DDF2EF;color:#0F5F55}
  .st-Entregado{--c:#1F6A40;background-color:#D7EBDD;color:#1F6A40}
  .st-Cancelado{--c:#C0412A;background-color:#F8E1DC;color:#8A2A1A}
  .tag[class*="st-"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
  .money{font-weight:600;font-variant-numeric:tabular-nums}
  .muted{color:var(--ink3)}
  .empty{padding:40px;text-align:center;color:var(--ink2)}
  .list{display:grid;grid-template-columns:minmax(0,1fr)}
  .li{display:flex;align-items:center;gap:12px;padding:10px 6px;border-top:1px solid var(--line);text-align:left;width:100%}
  .li:first-child{border-top:0}
  button.li:hover{background:var(--sf2);border-radius:10px}
  .li .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--bg2)}
  .li .ic svg{width:17px;height:17px}
  .li .ic.bad{background:var(--badSoft);color:var(--bad)}.li .ic.warn{background:var(--warnSoft);color:var(--warn)}.li .ic.brand{background:var(--brandSoft);color:var(--brandInk)}
  .li div{min-width:0;flex:1}
  .li b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li small{display:block;color:var(--ink3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thumb{width:44px;height:44px;flex:none;border-radius:10px;background:var(--bg2);overflow:hidden;display:grid;place-items:center}
  .thumb img{width:100%;height:100%;object-fit:cover}
  /* avatar con iniciales */
  .av{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;letter-spacing:.02em;box-shadow:0 0 0 2px var(--sf)}
  .who{display:flex;align-items:center;gap:10px;min-width:0}
  .who div{min-width:0}
  /* tabla de pedidos */
  table.ped{min-width:0}
  .xc{width:34px;padding:0 0 0 10px!important}
  table.ped td b,table.ped td small{white-space:nowrap}
  .xd .tag{white-space:normal;line-height:1.4}
  table.ped td:nth-child(4){white-space:nowrap}
  .chev{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);color:var(--ink3);transition:transform .2s,background-color .2s}
  .chev:hover{background:var(--bg);color:var(--ink)}
  tr.open .chev{transform:rotate(90deg);color:var(--ink);border-color:var(--line2)}
  tr.open>td{border-bottom-color:transparent}
  tr.det>td{background:var(--sf2);padding:14px 18px 18px!important}
  .xg{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px}
  .xp{display:flex;gap:14px;align-items:flex-start}
  .xf{width:120px;height:120px;object-fit:contain;border-radius:12px;background:var(--sf);border:1px solid var(--line);cursor:zoom-in;flex:none}
  .xi{margin-bottom:10px}
  .xi ul{margin:4px 0 0;padding-left:0;list-style:none;font-size:13px;display:grid;gap:2px}
  .xd{display:grid;gap:10px;align-content:start;font-size:13.5px}
  .xd .row{display:flex;gap:8px;flex-wrap:wrap}
  @media (max-width:820px){.xg{grid-template-columns:minmax(0,1fr)}.xp{flex-direction:column}}
  table.ped td{padding:9px 12px}
  table.ped tr.off{opacity:.62}
  .thc{width:52px;padding-right:0}
  .thumb.sm{width:40px;height:40px;border-radius:9px}
  .sortb{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .sortb:hover{color:var(--ink)}
  .sortb .ar{opacity:.35}
  [aria-sort="ascending"] .sortb .ar,[aria-sort="descending"] .sortb .ar{opacity:1;color:var(--ink)}
  .pcell{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  select.est{-webkit-appearance:none;appearance:none;font:600 12px Inter;height:28px;padding:0 26px 0 22px;border-radius:999px;border:1px solid rgba(30,22,17,.06);cursor:pointer;max-width:156px;
    background-image:radial-gradient(circle,var(--c) 3px,transparent 3.6px),linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:7px 50%,calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:12px 12px,4px 4px,4px 4px;background-repeat:no-repeat}
  /* barra de avance del pedido */
  .prog{display:flex;align-items:center;gap:8px;width:110px}
  @media (max-width:1480px){.hl{display:none}}
  .prog .tr{flex:1;height:6px;border-radius:999px;background:#EEE8DF;overflow:hidden}
  .prog .tr span{display:block;height:100%;border-radius:999px;background:var(--prog)}
  .prog.x .tr span{background:#D7C9C3}
  .prog small{width:32px;text-align:right;font-size:12px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
  .pager{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 30px;font-size:13px;flex-wrap:wrap;gap:10px}
  .pgs{display:flex;align-items:center;gap:4px}
  .pgs button{min-width:30px;height:30px;padding:0 6px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--ink2)}
  .pgs button:hover{background:var(--bg)}
  .pgs button[aria-current="page"]{background:var(--sf);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}
  .pgs button.arw{border:1px solid var(--line)}
  .pgs button[disabled]{opacity:.35;cursor:default}
  .pgs span{color:var(--ink3);padding:0 4px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:820px){
    .hm,.thc{display:none}
    table.ped td,table.ped th{padding:9px 6px;font-size:13px}
    table.ped td b{white-space:nowrap;font-size:12.5px}
    select.est{font-size:11px;padding:0 16px 0 17px;max-width:100px;background-position:5px 50%,calc(100% - 10px) 52%,calc(100% - 6px) 52%}
    .xc{width:28px;padding-left:6px!important}
    table.ped td:nth-child(3) small,table.ped td:nth-child(2) small,table.ped td:nth-child(4) small{display:none}
    table.ped td:nth-child(4) br{display:none}
    .phead .right{display:none}
    table.ped th{font-size:11px}
    .pre{display:none}
    .sortb .ar{display:none}
    table.ped td,table.ped th{padding:9px 4px}
    .ped .av{display:none}
  }
  .tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--sf)}
  table{width:100%;border-collapse:collapse;min-width:720px}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;font-weight:500;color:var(--ink3);background:var(--sf2);position:sticky;top:0;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover td{background:var(--sf2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .stepper{display:inline-flex;align-items:center;gap:6px}
  .stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--sf);font-weight:700}
  .stepper button:hover{border-color:var(--ink)}
  .stepper b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
  input.in,select.in{height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line2);background:var(--sf2);width:100%}
  input.in:focus{outline:none;border-color:var(--ink);background:var(--sf)}
