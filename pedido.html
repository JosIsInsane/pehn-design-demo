<body data-page="pedido">
<a class="skip" href="#main">Saltar al contenido</a>
<header data-marco="menu"></header>

<main id="main">
  <section class="cat-hero">
    <div class="wrap">
      <nav class="crumbs" aria-label="Ruta"><a href="index.html">Inicio</a><span aria-hidden="true">/</span><span>Mis pedidos</span></nav>
      <h1>Mis pedidos</h1>
      <p class="lead">Mira en qué va cada pedido, cuánto llevas pagado y sube tus comprobantes.</p>
    </div>
  </section>

  <section class="sec seguir-sec">
    <div class="wrap">
      <div class="mis-lista" id="misLista" aria-live="polite"></div>
    </div>
    <div class="wrap seguir">
      <form class="co seguir-form" id="seguir" novalidate>
        <h2 class="seguir-h">Buscar un pedido</h2>
        <div class="row2">
          <label>Número de pedido<input name="id" required autocomplete="off" spellcheck="false" autocapitalize="characters" placeholder="PEHN-261027-001…" inputmode="text"></label>
          <label>WhatsApp<input name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="9876 5432…"></label>
        </div>
        <button class="btn btn-dark" type="submit" id="seguirBtn">Buscar pedido</button>
        <div class="err" id="seguirErr" role="alert"></div>
      </form>
      <div id="estadoPedido" aria-live="polite"></div>
    </div>
  </section>
</main>

<footer data-marco="pie"></footer>
<div data-marco="flotantes"></div>

</body>
